<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYCLO Store</title>
  <style>
    :root {
      --bg: #0d0d0d;
      --card-bg: #161616;
      --accent: #ffffff;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --border: #27272a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }

    /* Navbar */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      background: rgba(13, 13, 13, 0.85);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 25px;
    }

    .brand-logo {
      font-size: 1.6rem;
      font-weight: 900;
      letter-spacing: 3px;
      color: var(--text);
      text-decoration: none;
    }

    .nav-actions {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--text);
      font-size: 1.2rem;
      cursor: pointer;
      position: relative;
    }

    .badge-count {
      position: absolute;
      top: -6px;
      right: -8px;
      background: #ef4444;
      color: #fff;
      font-size: 0.7rem;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Hero Section */
    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      background: linear-gradient(to bottom, rgba(0,0,0,0.3), rgba(13,13,13,0.95)), 
                  url('Firefly_Gemini Flash_hyper-realistic, high-end editorial product photography of a premium, thick cotton ho 719351.png') center/cover no-repeat fixed;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 20px;
    }

    .hero-content {
      animation: heroZoom 1.2s ease-out forwards;
    }

    @keyframes heroZoom {
      from { opacity: 0; transform: scale(0.95) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .hero h1 {
      font-size: 4rem;
      font-weight: 900;
      letter-spacing: 6px;
      margin-bottom: 10px;
    }

    .hero p {
      font-size: 1.2rem;
      color: var(--muted);
      margin-bottom: 30px;
    }

    .cta {
      background: #fff;
      color: #000;
      padding: 14px 35px;
      border: none;
      border-radius: 40px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .cta:hover {
      transform: scale(1.05);
    }

    /* Section Bar & Filters */
    .bar {
      padding: 40px 20px 10px;
      text-align: center;
    }

    .filters-container {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 20px;
    }

    .chip {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 8px 18px;
      border-radius: 20px;
      cursor: pointer;
    }

    .chip.active {
      background: #fff;
      color: #000;
      font-weight: bold;
    }

    /* Products Grid */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
      padding: 20px 5%;
      max-width: 1300px;
      margin: 0 auto;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
    }

    .card .pic {
      position: relative;
      width: 100%;
      height: 300px;
      background: #222;
    }

    .card .pic img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card .info {
      padding: 15px;
    }

    .card .name {
      font-weight: 600;
      margin: 5px 0;
    }

    .card .price {
      font-weight: bold;
      color: #fff;
    }

    /* Fullscreen Product Modal */
    .product-modal-fullscreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: var(--bg);
      z-index: 99999;
      display: none;
      flex-direction: column;
      overflow-y: auto;
    }

    .product-modal-fullscreen.open {
      display: flex;
    }

    .modal-close-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100001;
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: #fff;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      font-size: 1.5rem;
      cursor: pointer;
      backdrop-filter: blur(5px);
    }

    .modal-body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      width: 100%;
    }

    @media (min-width: 768px) {
      .modal-body {
        flex-direction: row;
      }
    }

    .modal-preview-img {
      flex: 1;
      min-height: 50vh;
      background-size: cover;
      background-position: center;
    }

    .modal-details {
      flex: 1;
      padding: 40px 30px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .size-option, .color-option {
      padding: 10px 18px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: #fff;
      border-radius: 8px;
      cursor: pointer;
      margin: 5px;
    }

    .size-option.active, .color-option.active {
      border-color: #fff;
      background: #fff;
      color: #000;
      font-weight: bold;
    }

    .action-buttons {
      display: flex;
      gap: 15px;
      margin-top: 30px;
    }

    .btn-buy-now {
      flex: 1;
      background: #fff;
      color: #000;
      padding: 15px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-add-cart {
      flex: 1;
      background: transparent;
      border: 1px solid #fff;
      color: #fff;
      padding: 15px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Cart Drawer & Modals */
    .drawer, .modal-popup {
      position: fixed;
      top: 0;
      right: 0;
      width: 100%;
      max-width: 400px;
      height: 100vh;
      background: var(--card-bg);
      z-index: 10000;
      display: none;
      flex-direction: column;
      padding: 20px;
      border-left: 1px solid var(--border);
    }

    /* Footer & Brand Info */
    .storyText {
      padding: 80px 20px;
      text-align: center;
      max-width: 800px;
      margin: 0 auto;
    }

    footer {
      background: #000;
      border-top: 1px solid var(--border);
      padding: 40px 20px;
      text-align: center;
    }

    .social-links a {
      color: var(--muted);
      margin: 0 10px;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <a href="#" class="brand-logo">CYCLO</a>
    <div class="nav-actions">
      <button class="icon-btn" onclick="openCart()">🛒 <span id="cartCount" class="badge-count">0</span></button>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-content">
      <h1>CYCLO</h1>
      <p>الأناقة والراحة في التصاميم العصرية</p>
      <button class="cta" onclick="document.getElementById('products').scrollIntoView({behavior: 'smooth'})">
        اكتشف التشكيلة
      </button>
    </div>
  </section>

  <!-- Shop Section -->
  <div class="bar">
    <h2>المتجر</h2>
    <p>اختر ما يناسب ذوقك اليوم</p>
  </div>

  <div id="filters" class="filters-container"></div>
  <div id="products" class="products-grid"></div>

  <!-- Fullscreen Product View Modal -->
  <div id="productModal" class="product-modal-fullscreen">
    <button class="modal-close-btn" onclick="closeProduct()">✕</button>
    <div class="modal-body">
      <div id="productPreview" class="modal-preview-img"></div>
      <div class="modal-details">
        <span id="productCat" style="color: var(--muted);"></span>
        <h2 id="productTitle" style="font-size: 2.5rem; margin: 10px 0;"></h2>
        <h3 id="productPrice" style="font-size: 1.8rem; margin-bottom: 20px;"></h3>

        <div style="margin-bottom: 20px;">
          <label>المقاس: <strong id="selectedSizeLabel"></strong></label>
          <div id="sizeOptions" style="display: flex; flex-wrap: wrap; margin-top: 10px;"></div>
        </div>

        <div style="margin-bottom: 20px;">
          <label>اللون: <strong id="selectedColorLabel"></strong></label>
          <div id="colorOptions" style="display: flex; flex-wrap: wrap; margin-top: 10px;"></div>
        </div>

        <div class="action-buttons">
          <button class="btn-buy-now" onclick="buyNow()">شراء الآن</button>
          <button class="btn-add-cart" onclick="addSelectedProduct()">إضافة للسلة</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Cart Drawer -->
  <div id="cartDrawer" class="drawer">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h3>سلة التسوق</h3>
      <button class="icon-btn" onclick="closeCart()">✕</button>
    </div>
    <div id="cartItems" style="flex: 1; overflow-y: auto;"></div>
    <div style="padding-top: 20px; border-top: 1px solid var(--border);">
      <div style="display: flex; justify-content: space-between; margin-bottom: 15px;">
        <span>الإجمالي:</span>
        <span id="cartTotal">0</span> جنيه
      </div>
      <button class="btn-buy-now" style="width: 100%;" onclick="openCheckout()">متابعة الشراء</button>
    </div>
  </div>

  <!-- Brand Story -->
  <section class="storyText">
    <span style="color: var(--muted); text-transform: uppercase;">عن البراند</span>
    <h3 style="font-size: 2rem; margin: 10px 0;">قصة CYCLO</h3>
    <p style="color: var(--muted);">علامة تجارية مصممة للشباب الذين يبحثون عن الأناقة والتميز والراحة اليومية بأفضل الخامات.</p>
  </section>

  <!-- Footer -->
  <footer>
    <h3 style="margin-bottom: 15px;">CYCLO STORE</h3>
    <p style="color: var(--muted); margin-bottom: 20px;">تواصل معنا عبر منصات التواصل الاجتماعي</p>
    <div class="social-links">
      <a href="https://instagram.com" target="_blank">Instagram</a>
      <a href="https://wa.me/201000000000" target="_blank">WhatsApp</a>
    </div>
  </footer>

  <script>
    const products = [
      { id: '1', name: 'هودي CYCLO رمادي فاخر', cat: 'هودي', price: 850, sizes: ['M', 'L', 'XL'], colors: ['رمادي', 'أسود'], image: 'Firefly_Gemini Flash_hyper-realistic, high-end editorial product photography of a premium, thick cotton ho 719351.png' },
      { id: '2', name: 'تيشيرت CYCLO كلاسيك', cat: 'تيشيرت', price: 450, sizes: ['S', 'M', 'L', 'XL'], colors: ['أبيض', 'أسود'], image: 'https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=500' },
      { id: '3', name: 'بنطلون سويت بانتق', cat: 'بنطلون', price: 650, sizes: ['M', 'L', 'XL'], colors: ['أسود', 'زيتي'], image: 'https://images.unsplash.com/photo-1552902865-b72c031ac5ea?w=500' }
    ];

    let cart = JSON.parse(localStorage.getItem('cyclo_cart')) || [];
    let filter = 'الكل';
    let selectedModalProduct = null;
    let selectedModalSize = 'M';
    let selectedModalColor = '';

    function renderFilters() {
      const categories = ["الكل", "تيشيرت", "هودي", "بنطلون"];
      const container = document.getElementById("filters");
      if (!container) return;
      
      container.innerHTML = categories.map(cat => `
        <button class="chip ${filter === cat ? 'active' : ''}" onclick="setFilter('${cat}')">${cat}</button>
      `).join('');
    }

    function setFilter(cat) {
      filter = cat;
      renderFilters();
      renderProducts();
    }

    function renderProducts() {
      const grid = document.getElementById("products");
      if (!grid) return;

      const filteredList = filter === "الكل" ? products : products.filter(p => p.cat === filter);

      grid.innerHTML = filteredList.map(p => `
        <div class="card" onclick="openProduct('${p.id}')">
          <div class="pic">
            <img src="${p.image}" alt="${p.name}">
          </div>
          <div class="info">
            <div style="color: var(--muted); font-size: 0.8rem;">${p.cat}</div>
            <div class="name">${p.name}</div>
            <div class="price">${p.price} جنيه</div>
          </div>
        </div>
      `).join('');
    }

    function openProduct(id) {
      selectedModalProduct = products.find(p => p.id === id);
      if (!selectedModalProduct) return;

      selectedModalSize = selectedModalProduct.sizes[0] || 'M';
      selectedModalColor = selectedModalProduct.colors[0] || '';

      document.getElementById('productPreview').style.backgroundImage = `url('${selectedModalProduct.image}')`;
      document.getElementById('productCat').textContent = selectedModalProduct.cat;
      document.getElementById('productTitle').textContent = selectedModalProduct.name;
      document.getElementById('productPrice').textContent = selectedModalProduct.price + ' جنيه';

      renderSizeOptions();
      renderColorOptions();

      document.getElementById('productModal').classList.add('open');
    }

    function closeProduct() {
      document.getElementById('productModal').classList.remove('open');
    }

    function renderSizeOptions() {
      const container = document.getElementById('sizeOptions');
      document.getElementById('selectedSizeLabel').textContent = selectedModalSize;
      container.innerHTML = selectedModalProduct.sizes.map(s => `
        <button class="size-option ${selectedModalSize === s ? 'active' : ''}" onclick="selectSize('${s}')">${s}</button>
      `).join('');
    }

    function selectSize(s) {
      selectedModalSize = s;
      renderSizeOptions();
    }

    function renderColorOptions() {
      const container = document.getElementById('colorOptions');
      document.getElementById('selectedColorLabel').textContent = selectedModalColor;
      container.innerHTML = selectedModalProduct.colors.map(c => `
        <button class="color-option ${selectedModalColor === c ? 'active' : ''}" onclick="selectColor('${c}')">${c}</button>
      `).join('');
    }

    function selectColor(c) {
      selectedModalColor = c;
      renderColorOptions();
    }

    function addSelectedProduct() {
      if (!selectedModalProduct) return;
      addToCart(selectedModalProduct.id, selectedModalSize, selectedModalColor);
      closeProduct();
      openCart();
    }

    function buyNow() {
      addSelectedProduct();
      openCheckout();
    }

    function addToCart(id, size, color) {
      const product = products.find(p => p.id === id);
      const existing = cart.find(x => x.id === id && x.size === size && x.color === color);
      if (existing) {
        existing.qty += 1;
      } else {
        cart.push({ id, name: product.name, price: product.price, size, color, qty: 1 });
      }
      saveCart();
    }

    function saveCart() {
      localStorage.setItem('cyclo_cart', JSON.stringify(cart));
      updateCart();
    }

    function updateCart() {
      const totalQty = cart.reduce((acc, x) => acc + x.qty, 0);
      const totalPrice = cart.reduce((acc, x) => acc + (x.price * x.qty), 0);

      document.getElementById('cartCount').textContent = totalQty;
      document.getElementById('cartTotal').textContent = totalPrice;

      const container = document.getElementById('cartItems');
      if (cart.length === 0) {
        container.innerHTML = '<p style="text-align:center; color: var(--muted); padding: 20px;">السلة فارغة</p>';
        return;
      }

      container.innerHTML = cart.map((x, i) => `
        <div style="display:flex; justify-content:space-between; margin-bottom: 15px;">
          <div>
            <strong>${x.name}</strong>
            <div style="font-size:0.8rem; color: var(--muted);">${x.size} | ${x.color}</div>
            <div>${x.price} جنيه</div>
          </div>
          <div>الكمية: ${x.qty}</div>
        </div>
      `).join('');
    }

    function openCart() { document.getElementById('cartDrawer').style.display = 'flex'; }
    function closeCart() { document.getElementById('cartDrawer').style.display = 'none'; }
    function openCheckout() { alert('جاري توجيهك إلى صفحة الدفع...'); }

    document.addEventListener("DOMContentLoaded", () => {
      renderFilters();
      renderProducts();
      updateCart();
    });
  </script>
</body>
</html>
