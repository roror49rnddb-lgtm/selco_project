<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم - SELCO Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #f4f4f5; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .container { width: 100%; max-width: 500px; background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    h1 { margin-top: 0; text-align: center; font-size: 22px; color: #111; margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; color: #333; }
    input[type="text"], input[type="number"], textarea, input[type="file"] { width: 100%; padding: 10px 12px; border: 1px solid #e4e4e7; border-radius: 8px; font-size: 14px; outline: none; }
    .sizes { display: flex; flex-wrap: wrap; gap: 10px; }
    .sizes label { display: flex; align-items: center; gap: 6px; margin: 0; font-weight: 500; border: 1px solid #e4e4e7; border-radius: 8px; padding: 8px 12px; cursor: pointer; }
    .sizes input { width: auto; }
    button { width: 100%; background: #000; color: #fff; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: 600; margin-top: 10px; }
    button:disabled { background: #a1a1aa; cursor: not-allowed; }
    #status { margin-top: 15px; text-align: center; font-weight: 600; font-size: 14px; min-height: 20px; }
  </style>
</head>
<body>

<div class="container">
  <h1>إضافة منتج جديد - SELCO</h1>
  <form id="productForm">
    <div class="form-group">
      <label for="title">اسم المنتج</label>
      <input type="text" id="title" required placeholder="مثال: T-Shirt Black">
    </div>
    
    <div class="form-group">
      <label for="price">السعر (EGP)</label>
      <input type="number" id="price" min="0" step="0.01" required placeholder="500">
    </div>

    <div class="form-group">
      <label for="description">الوصف</label>
      <textarea id="description" rows="3" placeholder="وصف المنتج..."></textarea>
    </div>

    <div class="form-group">
      <label>المقاسات المتاحة</label>
      <div class="sizes" id="sizes">
        <label><input type="checkbox" name="size" value="S"> S</label>
        <label><input type="checkbox" name="size" value="M"> M</label>
        <label><input type="checkbox" name="size" value="L"> L</label>
        <label><input type="checkbox" name="size" value="XL"> XL</label>
        <label><input type="checkbox" name="size" value="XXL"> XXL</label>
      </div>
    </div>

    <div class="form-group">
      <label for="image">صورة المنتج</label>
      <input type="file" id="image" accept="image/*" required>
    </div>

    <button type="submit" id="submitBtn">حفظ ونشر المنتج</button>
    <div id="status"></div>
  </form>
</div>

<script>
  const SUPABASE_URL = "https://gvbqjpaeibpdobgqiibq.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd2YnFqcGFlaWJwZG9iZ3FpaWJxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1NzcyOTMsImV4cCI6MjEwMzE1MzI5M30.28Vzz0yP5nEJ3Fkv7kM1eiL5Ff6_rrTNtOsv1-D3HWs";
  const BUCKET = "product-images";

  const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const form = document.getElementById('productForm');
  const submitBtn = document.getElementById('submitBtn');
  const statusDiv = document.getElementById('status');

  function setStatus(text, color) {
    statusDiv.textContent = text;
    statusDiv.style.color = color;
  }

  function safeName(name) {
    const ext = name.includes('.') ? name.split('.').pop().toLowerCase() : 'jpg';
    return Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '.' + ext;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const title = document.getElementById('title').value.trim();
    const price = parseFloat(document.getElementById('price').value);
    const description = document.getElementById('description').value.trim();
    const sizes = Array.from(document.querySelectorAll('input[name="size"]:checked')).map((el) => el.value);
    const file = document.getElementById('image').files[0];

    if (!title || isNaN(price) || !file) {
      setStatus("برجاء ملء جميع الحقول المطلوبة واختيار صورة.", "#dc2626");
      return;
    }
    if (sizes.length === 0) {
      setStatus("برجاء اختيار مقاس واحد على الأقل.", "#dc2626");
      return;
    }

    submitBtn.disabled = true;
    setStatus("جاري الحفظ...", "#3b82f6");

    try {
      const path = safeName(file.name);
      const { error: uploadError } = await client.storage
        .from(BUCKET)
        .upload(path, file, { cacheControl: "3600", contentType: file.type || "image/jpeg" });

      if (uploadError) throw new Error("فشل رفع الصورة: " + uploadError.message);

      const { data: urlData } = client.storage.from(BUCKET).getPublicUrl(path);
      const imageUrl = urlData.publicUrl;

      const { error: insertError } = await client.from('products').insert([{
        title: title,
        price: price,
        description: description,
        sizes: sizes,
        images: [imageUrl]
      }]);

      if (insertError) throw new Error("فشل حفظ المنتج: " + insertError.message);

      setStatus("تمت إضافة المنتج بنجاح! 🎉", "#16a34a");
      form.reset();
    } catch (err) {
      setStatus("خطأ: " + err.message, "#dc2626");
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>

</body>
</html>
