<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم - CYCLO Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #f4f4f5; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; }
    .container { width: 100%; max-width: 560px; background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    h1 { margin-top: 0; text-align: center; font-size: 22px; color: #111; margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; color: #333; }
    input[type="text"], input[type="number"], textarea, select { width: 100%; padding: 10px 12px; border: 1px solid #e4e4e7; border-radius: 8px; font-size: 14px; outline: none; background: #fff; }
    .options { display: flex; flex-wrap: wrap; gap: 10px; }
    .options label { display: flex; align-items: center; gap: 6px; margin: 0; font-weight: 500; border: 1px solid #e4e4e7; border-radius: 8px; padding: 8px 12px; cursor: pointer; }
    .options input { width: auto; }
    .swatch { width: 14px; height: 14px; border-radius: 50%; border: 1px solid #e4e4e7; display: inline-block; }
    button { width: 100%; background: #000; color: #fff; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: 600; margin-top: 10px; }
    button:disabled { background: #a1a1aa; cursor: not-allowed; }
    #status { margin-top: 15px; text-align: center; font-weight: 600; font-size: 14px; min-height: 20px; }
    .image-upload-area { border: 2px dashed #d4d4d8; border-radius: 10px; padding: 20px; text-align: center; cursor: pointer; transition: .2s; margin-bottom: 10px; }
    .image-upload-area:hover { border-color: #111; background: #fafafa; }
    .image-upload-area p { margin: 0; color: #71717a; font-size: 13px; }
    .preview-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
    .preview-item { position: relative; width: 80px; height: 80px; border-radius: 8px; overflow: hidden; border: 1px solid #e4e4e7; }
    .preview-item img { width: 100%; height: 100%; object-fit: cover; }
    .preview-item .remove-btn { position: absolute; top: 2px; right: 2px; width: 22px; height: 22px; border-radius: 50%; background: rgba(0,0,0,.6); color: #fff; border: 0; cursor: pointer; font-size: 14px; display: grid; place-items: center; padding: 0; }
    .preview-item .remove-btn:hover { background: #dc2626; }
    .preview-item .badge-main { position: absolute; bottom: 0; left: 0; right: 0; background: #111; color: #fff; font-size: 9px; text-align: center; padding: 2px; font-weight: 700; }
    .file-input { display: none; }
  </style>
</head>
<body>

<div class="container">
  <h1>إضافة منتج جديد - CYCLO</h1>
  <form id="productForm">
    <div class="form-group">
      <label for="title">اسم المنتج</label>
      <input type="text" id="title" required placeholder="مثال: T-Shirt Black">
    </div>
    
    <div class="form-group">
      <label for="price">السعر (EGP)</label>
      <input type="number" id="price" min="0" step="0.01" required placeholder="500">
    </div>

    <div class="form-group">
      <label for="stock">المخزون (الكمية المتاحة)</label>
      <input type="number" id="stock" min="0" step="1" value="10" required>
    </div>

    <div class="form-group">
      <label for="description">الوصف</label>
      <textarea id="description" rows="3" placeholder="وصف المنتج..."></textarea>
    </div>

    <div class="form-group">
      <label for="category">الفئة</label>
      <select id="category" required>
        <option value="" disabled selected>اختر الفئة</option>
        <option value="تيشيرت">تيشيرت</option>
        <option value="هودي">هودي</option>
        <option value="بنطلون">بنطلون</option>
        <option value="قميص">قميص</option>
        <option value="سويت شيرت">سويت شيرت</option>
        <option value="جاكيت">جاكيت</option>
      </select>
    </div>

    <div class="form-group">
      <label>الألوان المتاحة</label>
      <div class="options" id="colors">
        <label><input type="checkbox" name="color" value="أسود"><span class="swatch" style="background:#171717"></span> أسود</label>
        <label><input type="checkbox" name="color" value="أبيض"><span class="swatch" style="background:#f4f4f0"></span> أبيض</label>
        <label><input type="checkbox" name="color" value="أزرق"><span class="swatch" style="background:#3b6f9f"></span> أزرق</label>
        <label><input type="checkbox" name="color" value="رمادي"><span class="swatch" style="background:#858781"></span> رمادي</label>
        <label><input type="checkbox" name="color" value="بيج"><span class="swatch" style="background:#c8b69c"></span> بيج</label>
        <label><input type="checkbox" name="color" value="زيتي"><span class="swatch" style="background:#69705d"></span> زيتي</label>
      </div>
    </div>

    <div class="form-group">
      <label>المقاسات المتاحة</label>
      <div class="options" id="sizes">
        <label><input type="checkbox" name="size" value="S"> S</label>
        <label><input type="checkbox" name="size" value="M"> M</label>
        <label><input type="checkbox" name="size" value="L"> L</label>
        <label><input type="checkbox" name="size" value="XL"> XL</label>
        <label><input type="checkbox" name="size" value="XXL"> XXL</label>
      </div>
    </div>

    <div class="form-group">
      <label>صور المنتج (يمكنك اختيار أكثر من صورة)</label>
      <div class="image-upload-area" id="uploadArea" onclick="document.getElementById('image').click()">
        <p>اضغط لاختيار صور واحدة أو أكثر</p>
      </div>
      <input type="file" id="image" class="file-input" accept="image/*" multiple>
      <div class="preview-grid" id="previewGrid"></div>
    </div>

    <button type="submit" id="submitBtn">حفظ ونشر المنتج</button>
    <div id="status"></div>
  </form>
</div>

<script>
  const SUPABASE_URL = "https://sawzpupdhswkclsfftzf.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNhd3pwdXBkaHN3a2Nsc2ZmdHpmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NDQ2MDUsImV4cCI6MjEwMzMyMDYwNX0.oBxMI9ATIXmYHp26wZfNMG221SLaHLDmn4ieYXJMJOk";
  const BUCKET = "product-images";

  const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const form = document.getElementById('productForm');
  const submitBtn = document.getElementById('submitBtn');
  const statusDiv = document.getElementById('status');
  const fileInput = document.getElementById('image');
  const previewGrid = document.getElementById('previewGrid');
  let selectedFiles = [];

  function setStatus(text, color) {
    statusDiv.textContent = text;
    statusDiv.style.color = color;
  }

  function safeName(name) {
    const ext = name.includes('.') ? name.split('.').pop().toLowerCase() : 'jpg';
    return Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '.' + ext;
  }

  fileInput.addEventListener('change', (e) => {
    const newFiles = Array.from(e.target.files);
    newFiles.forEach(f => selectedFiles.push(f));
    renderPreviews();
    fileInput.value = '';
  });

  function renderPreviews() {
    previewGrid.innerHTML = selectedFiles.map((file, i) => {
      const url = URL.createObjectURL(file);
      return `<div class="preview-item">
        <img src="${url}" alt="preview">
        ${i === 0 ? '<div class="badge-main">رئيسية</div>' : ''}
        <button type="button" class="remove-btn" onclick="removeFile(${i})">×</button>
      </div>`;
    }).join('');
  }

  function removeFile(index) {
    selectedFiles.splice(index, 1);
    renderPreviews();
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const title = document.getElementById('title').value.trim();
    const price = parseFloat(document.getElementById('price').value);
    const stock = parseInt(document.getElementById('stock').value, 10);
    const description = document.getElementById('description').value.trim();
    const category = document.getElementById('category').value;
    const sizes = Array.from(document.querySelectorAll('input[name="size"]:checked')).map((el) => el.value);
    const colors = Array.from(document.querySelectorAll('input[name="color"]:checked')).map((el) => el.value);

    if (!title || isNaN(price) || isNaN(stock)) {
      setStatus("برجاء ملء جميع الحقول المطلوبة.", "#dc2626");
      return;
    }
    if (!category) {
      setStatus("برجاء اختيار الفئة.", "#dc2626");
      return;
    }
    if (sizes.length === 0) {
      setStatus("برجاء اختيار مقاس واحد على الأقل.", "#dc2626");
      return;
    }
    if (colors.length === 0) {
      setStatus("برجاء اختيار لون واحد على الأقل.", "#dc2626");
      return;
    }
    if (selectedFiles.length === 0) {
      setStatus("برجاء اختيار صورة واحدة على الأقل.", "#dc2626");
      return;
    }

    submitBtn.disabled = true;
    setStatus("جاري رفع الصور وحفظ المنتج...", "#3b82f6");

    try {
      const imageUrls = [];
      for (const file of selectedFiles) {
        const path = safeName(file.name);
        const { error: uploadError } = await client.storage
          .from(BUCKET)
          .upload(path, file, { cacheControl: "3600", contentType: file.type || "image/jpeg" });
        if (uploadError) throw new Error("فشل رفع الصورة: " + uploadError.message);
        const { data: urlData } = client.storage.from(BUCKET).getPublicUrl(path);
        imageUrls.push(urlData.publicUrl);
      }

      const { error: insertError } = await client.from('products').insert([{
        title: title,
        price: price,
        stock: stock,
        description: description,
        category: category,
        sizes: sizes,
        colors: colors,
        images: imageUrls
      }]);

      if (insertError) throw new Error("فشل حفظ المنتج: " + insertError.message);

      setStatus("تمت إضافة المنتج بنجاح! 🎉", "#16a34a");
      form.reset();
      selectedFiles = [];
      renderPreviews();
    } catch (err) {
      setStatus("خطأ: " + err.message, "#dc2626");
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>

</body>
</html>
